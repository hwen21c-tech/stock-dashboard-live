name: pokemon-bank

# 🌙 포켓몬 배틀 자정 문제 은행 보충 — 매일 00:05 KST (15:05 UTC 전날)
#  public/hangul-bank.json · public/english-bank.json 에 중복되지 않는 낱말만 보충하고
#  sd_live 저장소에 푸시해 Vercel 자동 배포를 트리거한다.
#  예비 어휘(scripts/pokemon_bank_pool.json)가 소진되면 적게 넣고 로그만 남긴다(가짜 낱말 금지).

on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-bank
  cancel-in-progress: false

jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 문제 은행 보충
        run: python3 scripts/pokemon_bank_supplement.py

      - name: 커밋·푸시 (Vercel 자동 배포)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hangul-bank.json public/english-bank.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date '+%m-%d %H:%M')
          git commit -q -m "chore(pokemon): 문제 은행 보충 ${STAMP} KST"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push -q origin main; then echo "푸시 완료"; exit 0; fi
            echo "푸시 재시도 $i"; sleep 8
          done
          echo "푸시 실패"; exit 1

name: market-archive

# 💾 관제탑 일별 아카이브 자동 저장 (sd_live 쪽) — 평일 장마감 뒤 2회
#   16:10 KST → 07:10 UTC   (cron '10 7 * * 1-5')
#   20:10 KST → 11:10 UTC   (cron '10 11 * * 1-5')
#  sd_live/public/data/ 의 당일 스냅샷·지수/테마 요약을
#  sd_live/public/data/archives/YYYY-MM-DD.json + index.json 으로 남긴다.
#  관제탑 📁 보관함(openHistoryModal)이 읽는 스키마 그대로다.

on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '10 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-archive-live
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: sd_live
          fetch-depth: 1

      - name: 관제탑(정적) 읽기용 클론
        run: git clone --depth 1 https://github.com/hwen21c-tech/stock-dashboard.git deploy_repo

      - name: 스크립트 배치
        run: |
          mkdir -p scripts
          cp sd_live/scripts/archive_daily_snapshot.py scripts/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 아카이브 생성 (sd_live)
        run: python3 scripts/archive_daily_snapshot.py --only sd_live

      - name: 커밋·푸시 (sd_live → Vercel)
        working-directory: sd_live
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/archives
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          DATE=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          STAMP=$(TZ=Asia/Seoul date '+%H:%M')
          git commit -q -m "chore(보관함): ${DATE} 장마감 아카이브 ${STAMP} KST"
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main || true
            if git push -q origin main; then echo "푸시 완료"; exit 0; fi
            echo "푸시 재시도 $i"; sleep 8
          done
          echo "푸시 실패"; exit 1

      - name: 배포 확인 (index.json 의 latest)
        run: |
          set -e
          URL="https://stock-dashboard-live-6frm.vercel.app/data/archives/index.json"
          for i in $(seq 1 8); do
            CODE=$(curl -s -o /tmp/idx.json -m 30 -w '%{http_code}' "$URL" || true)
            LATEST=$(python3 -c "import json;print(json.load(open('/tmp/idx.json')).get('latest'))" 2>/dev/null || echo none)
            echo "  $CODE latest=$LATEST"
            if [ "$CODE" = "200" ] && [ "$LATEST" = "$(TZ=Asia/Seoul date '+%Y-%m-%d')" ]; then
              echo "배포 확인 완료"; exit 0
            fi
            sleep 20
          done
          echo "⚠️ Vercel 반영이 아직 안 보입니다 — 커밋은 완료 상태입니다"
